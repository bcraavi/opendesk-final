<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenDesk</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        color: #1a1a1a;
        padding: 16px;
      }
      .popup-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .popup-logo {
        width: 28px;
        height: 28px;
        background: #ff8c32;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: bold;
        font-size: 16px;
      }
      .popup-title { font-size: 16px; font-weight: 600; }
      .popup-status {
        padding: 10px 12px;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 12px;
      }
      .popup-status.active {
        background: #f0fdf4;
        color: #16a34a;
        border: 1px solid #bbf7d0;
      }
      .popup-status.inactive {
        background: #f7f7f7;
        color: #666;
        border: 1px solid #e0e0e0;
      }
      .popup-info {
        font-size: 12px;
        color: #999;
        line-height: 1.5;
      }
      .popup-version {
        margin-top: 12px;
        font-size: 11px;
        color: #ccc;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="popup-root"></div>
    <script type="module" src="./Popup.tsx"></script>
  </body>
</html>
